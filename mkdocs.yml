          - "FINE-TUNING AGÊNTICO: A ABORDAGEM DA META": estudos/agentes-de-ia/fine-tuning-agentico-meta.md
          - "JEV: MODELOS DE DECISÃO": estudos/agentes-de-ia/jev-modelos-decisao.md
      - COMPUTAÇÃO QUÂNTICA (IBM):
